# Distinct non-login UIDs prevent QR/worker access to the staff process's secrets.
# Run systemd-sysusers on this file only during approved deployment.
u assettracker-staff - "Asset Tracker staff runtime" /nonexistent /usr/sbin/nologin
u assettracker-qr - "Asset Tracker QR runtime" /nonexistent /usr/sbin/nologin
u assettracker-reconciler - "Asset Tracker QR recovery" /nonexistent /usr/sbin/nologin
u assettracker-gateway - "Asset Tracker private TLS gateway" /nonexistent /usr/sbin/nologin

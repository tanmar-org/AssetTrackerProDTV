# Full private-gateway Nginx config for the dedicated non-root systemd service.
# Only the rendered vm.conf/QR include and TLS files belong in this directory.
worker_processes 1;
pid /run/assettracker-gateway/nginx.pid;
error_log stderr warn;
events { worker_connections 256; }
http {
    server_tokens off;
    access_log off;
    client_body_temp_path /var/lib/assettracker-gateway/body;
    proxy_temp_path /var/lib/assettracker-gateway/proxy;
    fastcgi_temp_path /var/lib/assettracker-gateway/fastcgi;
    uwsgi_temp_path /var/lib/assettracker-gateway/uwsgi;
    scgi_temp_path /var/lib/assettracker-gateway/scgi;
    include /etc/assettracker/gateway/vm.conf;
}
